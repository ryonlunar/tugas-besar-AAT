<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AAT demo</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="terminal/xterm.css" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="terminal/xterm.js"></script>
    <script defer src="terminal/addon-fit.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#overview">AAT<span>demo</span></a>
      <nav aria-label="Pages">
        <a href="#overview" data-page="overview">Overview</a>
        <a href="#p1" data-page="p1">P1</a><a href="#p2" data-page="p2">P2</a>
        <a href="#p3" data-page="p3">P3</a><a href="#p4" data-page="p4">P4</a>
        <a href="#p5" data-page="p5">P5</a>
        <a href="#inspect" data-page="inspect">Inspect</a>
        <a href="#runs" data-page="runs">Runs</a>
      </nav>
      <span id="project" class="project">Connecting…</span>
    </header>
    <div class="app-grid">
      <main id="main"><p>Loading…</p></main>
      <section id="terminal-panel" aria-label="Command terminal">
        <div class="terminal-toolbar">
          <strong>Terminal</strong
          ><label
            class="json-format"
            title="Format JSON reads when placing the next helper command"
            >JSON
            <select id="json-format" aria-label="JSON output format">
              <option value="pretty">Pretty</option>
              <option value="raw">Raw</option>
            </select></label
          ><span id="command-state">idle</span>
          <div class="terminal-tools">
            <button
              id="stop-command"
              hidden
              title="Stop the command and wait for cleanup (Ctrl+C)"
            >
              Stop
            </button>
            <button id="clear-terminal" title="Clear the terminal display">
              Clear
            </button>
            <button id="copy-terminal" title="Copy terminal output">
              Copy
            </button>
            <a id="download-log" hidden>Log ↓</a>
            <button
              id="expand-terminal"
              aria-label="Expand terminal"
              aria-pressed="false"
              title="Expand terminal for a screenshot"
            >
              ⤢
            </button>
          </div>
        </div>
        <div id="terminal"></div>
        <div class="command-entry">
          <span aria-hidden="true">$</span>
          <textarea
            id="command-input"
            rows="1"
            maxlength="32768"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            aria-label="Shell command, Enter to run, Shift+Enter for a new line"
            placeholder="Type a command, or choose a helper"
            disabled
          ></textarea>
        </div>
      </section>
    </div>
    <dialog id="info-dialog">
      <div class="dialog-heading">
        <h2 id="info-title"></h2>
        <button id="close-info" aria-label="Close information">×</button>
      </div>
      <div id="info-content"></div>
    </dialog>
    <dialog
      id="confirm-service"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-description"
    >
      <div class="dialog-heading"><h2 id="confirm-title"></h2></div>
      <p id="confirm-description"></p>
      <div class="dialog-actions">
        <button id="cancel-service" class="button" autofocus>Cancel</button>
        <button id="queue-service" class="button">Place command</button>
      </div>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
