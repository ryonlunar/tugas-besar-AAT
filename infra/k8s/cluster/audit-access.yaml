apiVersion: v1
kind: ServiceAccount
metadata:
  name: aggregator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aggregator-topology
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aggregator-topology
subjects:
  - kind: ServiceAccount
    name: aggregator
    namespace: sistem-informasi-kebencanaan-bnpb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aggregator-topology
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aggregator-topology
spec:
  podSelector:
    matchLabels: {role: aggregator}
  policyTypes: [Egress]
  egress:
    - ports: [{port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]
