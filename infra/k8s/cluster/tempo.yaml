apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
        app.kubernetes.io/name: tempo
        role: other
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.7.2
          args: [-config.file=/etc/tempo/tempo.yaml]
          env:
            - name: GOMEMLIMIT
              value: 128MiB
          ports:
            - name: http
              containerPort: 3200
            - name: otlp
              containerPort: 4318
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: configuration
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 60
            periodSeconds: 2
      volumes:
        - name: configuration
          configMap:
            name: tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp
      port: 4318
      targetPort: otlp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trace-export
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: tempo}}
      ports: [{port: 4318, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-input
spec:
  podSelector:
    matchLabels:
      app: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports: [{port: 4318, protocol: TCP}]
    - from:
        - podSelector: {matchLabels: {app: grafana}}
      ports: [{port: 3200, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-traces
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: tempo}}
      ports: [{port: 3200, protocol: TCP}]
