apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        role: other
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        aat.dev/control: "true"
      containers:
        - name: registry
          image: registry:2.8.3
          env:
            - name: GOMEMLIMIT
              value: 128MiB
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: development-registry
spec:
  podSelector:
    matchLabels:
      app: registry
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 5000, protocol: TCP}]
