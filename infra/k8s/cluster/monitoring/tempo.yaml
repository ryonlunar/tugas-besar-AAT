auth_enabled: false
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 1h
    compacted_block_retention: 10m
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
querier:
  max_concurrent_queries: 2
query_frontend:
  search:
    concurrent_jobs: 4
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 1048576
      burst_size_bytes: 2097152
    global:
      max_bytes_per_trace: 65536
