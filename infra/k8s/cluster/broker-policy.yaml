apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-cluster
spec:
  podSelector:
    matchLabels:
      app: nats-ha
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: nats-ha}}
      ports: [{port: 6222, protocol: TCP}]
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 7777, protocol: TCP}]
  egress:
    - to:
        - podSelector: {matchLabels: {app: nats-ha}}
      ports: [{port: 6222, protocol: TCP}]
