apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sistem-informasi-kebencanaan-bnpb
resources:
- namespace.yaml
- applications.yaml
- claims.yaml
- postgres.yaml
- monitoring.yaml
- network-policies.yaml
configMapGenerator:
- name: prometheus-config
  files:
  - monitoring/prometheus.yml
- name: loki-config
  files:
  - monitoring/loki.yml
- name: alloy-config
  files:
  - monitoring/config.alloy
- name: grafana-datasources
  files:
  - monitoring/sources.yml
- name: grafana-providers
  files:
  - monitoring/dashboards.yml
- name: grafana-dashboard
  files:
  - monitoring/aat.json
