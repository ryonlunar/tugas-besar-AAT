apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        app.kubernetes.io/name: auth
        role: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: auth
        image: aat.local/auth:m2-dev
        ports:
        - name: http
          containerPort: 8084
        - name: metrics
          containerPort: 9091
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        imagePullPolicy: Never
        env:
        - name: MEDIA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: aat-credentials
              key: MEDIA_CLIENT_SECRET
        - name: FIELD_TEAM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: aat-credentials
              key: FIELD_TEAM_CLIENT_SECRET
        - name: BNPB_INTERNAL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: aat-credentials
              key: BNPB_INTERNAL_CLIENT_SECRET
        volumeMounts:
        - name: data
          mountPath: /data
        - name: jwt
          mountPath: /run/secrets
          readOnly: true
        envFrom:
        - configMapRef:
            name: aat-runtime
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: auth-data
      - name: jwt
        secret:
          secretName: aat-jwt-private
          defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
  - name: http
    port: 8084
    targetPort: http
    nodePort: 30084
  type: NodePort
