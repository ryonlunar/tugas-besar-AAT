apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmkg-mock
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bmkg-mock
  template:
    metadata:
      labels:
        app: bmkg-mock
        app.kubernetes.io/name: bmkg-mock
        role: mock
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: bmkg-mock
        image: aat.local/bmkg-mock:m2-dev
        ports:
        - name: http
          containerPort: 8081
        - name: metrics
          containerPort: 9091
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 128Mi
        imagePullPolicy: Never
        env:
        - name: BMKG_API_KEY
          valueFrom:
            secretKeyRef:
              name: aat-credentials
              key: BMKG_API_KEY
        envFrom:
        - configMapRef:
            name: aat-runtime
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: bmkg-mock
spec:
  selector:
    app: bmkg-mock
  ports:
  - name: http
    port: 8081
    targetPort: http
  type: ClusterIP
---
