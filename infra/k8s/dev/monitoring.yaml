apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        role: other
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:13.2.3
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: 'true'
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: 'true'
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: /etc/grafana/dashboards/aat.json
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: providers
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboard
          mountPath: /etc/grafana/dashboards
          readOnly: true
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: providers
        configMap:
          name: grafana-providers
      - name: dashboard
        configMap:
          name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
    nodePort: 30000
  type: NodePort
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alloy-data
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
        app.kubernetes.io/name: alloy
        role: other
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
      containers:
      - name: alloy
        image: grafana/alloy:v1.20.1
        ports:
        - name: http
          containerPort: 12345
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        args:
        - run
        - --storage.path=/var/lib/alloy
        - --server.http.listen-addr=0.0.0.0:12345
        - /etc/alloy/config.alloy
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
          readOnly: true
        - name: data
          mountPath: /var/lib/alloy
        startupProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
      serviceAccountName: monitoring
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: alloy-data
      - name: config
        configMap:
          name: alloy-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring
subjects:
- kind: ServiceAccount
  name: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats-exporter
  template:
    metadata:
      labels:
        app: nats-exporter
        app.kubernetes.io/name: nats-exporter
        role: other
    spec:
      automountServiceAccountToken: false
      containers:
      - name: exporter
        image: natsio/prometheus-nats-exporter:0.20.2
        args:
        - -varz
        - -healthz
        - -healthz_js_enabled_only
        - -jsz
        - consumers
        - http://nats:8222
        ports:
        - name: metrics
          containerPort: 7777
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: metrics
