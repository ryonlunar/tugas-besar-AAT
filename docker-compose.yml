# M1 services; third-consumer is enabled through the demo profile.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aat}
      POSTGRES_USER: ${POSTGRES_USER:-aat_aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a locally generated POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [store-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222", "--auth", "${NATS_TOKEN:?Set a separate locally generated NATS_TOKEN}"]
    volumes:
      - nats-data:/data
    networks: [event-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bmkg-mock:
    build:
      context: .
      dockerfile: services/bmkg-mock/Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      BMKG_API_KEY: ${BMKG_API_KEY:?Set a locally generated BMKG_API_KEY}
      BMKG_MOCK_HTTP_PORT: ${BMKG_MOCK_HTTP_PORT:-8081}
      BMKG_DELAY_MS: ${BMKG_DELAY_MS:-100}
      MOCK_EVENT_INTERVAL: ${MOCK_EVENT_INTERVAL:-10s}
      MOCK_SEED_COUNT: ${MOCK_SEED_COUNT:-20}
    ports:
      - "127.0.0.1:${BMKG_MOCK_HTTP_PORT:-8081}:${BMKG_MOCK_HTTP_PORT:-8081}"
    healthcheck:
      test: ["CMD", "/bmkg-mock", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 5s
    networks: [source-net]

  pvmbg-mock:
    build:
      context: .
      dockerfile: services/pvmbg-mock/Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      PVMBG_TOKEN: ${PVMBG_TOKEN:?Set a locally generated PVMBG_TOKEN}
      PVMBG_MOCK_HTTP_PORT: ${PVMBG_MOCK_HTTP_PORT:-8082}
      PVMBG_DELAY_MIN_MS: ${PVMBG_DELAY_MIN_MS:-500}
      PVMBG_DELAY_MAX_MS: ${PVMBG_DELAY_MAX_MS:-3000}
      MOCK_EVENT_INTERVAL: ${MOCK_EVENT_INTERVAL:-10s}
      MOCK_SEED_COUNT: ${MOCK_SEED_COUNT:-20}
      PVMBG_SCHEMA_VERSION: ${PVMBG_SCHEMA_VERSION:-1}
      PVMBG_OUTAGE_ENABLED: ${PVMBG_OUTAGE_ENABLED:-false}
    ports:
      - "127.0.0.1:${PVMBG_MOCK_HTTP_PORT:-8082}:${PVMBG_MOCK_HTTP_PORT:-8082}"
    healthcheck:
      test: ["CMD", "/pvmbg-mock", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 5s
    networks: [source-net]

  aggregator:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGGREGATOR_HTTP_PORT: ${AGGREGATOR_HTTP_PORT:-8083}
      AGGREGATOR_API_KEY: ${AGGREGATOR_API_KEY:?Set a separate locally generated AGGREGATOR_API_KEY}
      AGGREGATOR_MAX_INFLIGHT: ${AGGREGATOR_MAX_INFLIGHT:-128}
      BMKG_BASE_URL: ${BMKG_BASE_URL:-http://bmkg-mock:8081}
      BMKG_API_KEY: ${BMKG_API_KEY:?Set a locally generated BMKG_API_KEY}
      PVMBG_BASE_URL: ${PVMBG_BASE_URL:-http://pvmbg-mock:8082}
      PVMBG_TOKEN: ${PVMBG_TOKEN:?Set a locally generated PVMBG_TOKEN}
      SOURCE_POLL_INTERVAL: ${SOURCE_POLL_INTERVAL:-5s}
      BMKG_REQUEST_TIMEOUT: ${BMKG_REQUEST_TIMEOUT:-1s}
      PVMBG_REQUEST_TIMEOUT: ${PVMBG_REQUEST_TIMEOUT:-4s}
      SOURCE_RESPONSE_MAX_BYTES: ${SOURCE_RESPONSE_MAX_BYTES:-1048576}
      SOURCE_STALE_AFTER: ${SOURCE_STALE_AFTER:-15s}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-aat}
      POSTGRES_USER: ${POSTGRES_USER:-aat_aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a locally generated POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      DB_READ_MAX_CONNS: ${DB_READ_MAX_CONNS:-10}
      DB_BMKG_WRITE_MAX_CONNS: ${DB_BMKG_WRITE_MAX_CONNS:-2}
      DB_PVMBG_WRITE_MAX_CONNS: ${DB_PVMBG_WRITE_MAX_CONNS:-2}
      DB_RELAY_MAX_CONNS: ${DB_RELAY_MAX_CONNS:-2}
      DB_READ_TIMEOUT: ${DB_READ_TIMEOUT:-200ms}
      DB_WRITE_TIMEOUT: ${DB_WRITE_TIMEOUT:-2s}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-2s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-30s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-5s}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:?Set a separate locally generated NATS_TOKEN}
      NATS_STREAM_NAME: ${NATS_STREAM_NAME:-HAZARD_EVENTS}
      NATS_MAX_AGE: ${NATS_MAX_AGE:-24h}
      NATS_MAX_BYTES: ${NATS_MAX_BYTES:-268435456}
      NATS_MAX_MSGS: ${NATS_MAX_MSGS:-100000}
      NATS_MAX_MSG_SIZE: ${NATS_MAX_MSG_SIZE:-65536}
      NATS_DUPLICATE_WINDOW: ${NATS_DUPLICATE_WINDOW:-2m}
      NATS_PUBLISH_TIMEOUT: ${NATS_PUBLISH_TIMEOUT:-2s}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-500ms}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_MAX_PENDING: ${OUTBOX_MAX_PENDING:-10000}
      OUTBOX_RETRY_MIN: ${OUTBOX_RETRY_MIN:-1s}
      OUTBOX_RETRY_MAX: ${OUTBOX_RETRY_MAX:-30s}
    ports:
      - "127.0.0.1:${AGGREGATOR_HTTP_PORT:-8083}:${AGGREGATOR_HTTP_PORT:-8083}"
    healthcheck:
      test: ["CMD", "/aggregator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 10s
    networks: [source-net, api-net, store-net, event-net]

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      AUTH_HTTP_PORT: ${AUTH_HTTP_PORT:-8084}
      AUTH_STATE_PATH: /data/auth.db
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
      JWT_ISSUER: ${JWT_ISSUER:-aat-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-aat-client-api}
      MEDIA_CLIENT_SECRET: ${MEDIA_CLIENT_SECRET:?Set a separate MEDIA_CLIENT_SECRET}
      FIELD_TEAM_CLIENT_SECRET: ${FIELD_TEAM_CLIENT_SECRET:?Set a separate FIELD_TEAM_CLIENT_SECRET}
      BNPB_INTERNAL_CLIENT_SECRET: ${BNPB_INTERNAL_CLIENT_SECRET:?Set a separate BNPB_INTERNAL_CLIENT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-60s}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-24h}
      AUTH_MAX_INFLIGHT: ${AUTH_MAX_INFLIGHT:-16}
      AUTH_BODY_MAX_BYTES: ${AUTH_BODY_MAX_BYTES:-8192}
      AUTH_READ_TIMEOUT: ${AUTH_READ_TIMEOUT:-2s}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-2s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-30s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-5s}
    volumes:
      - auth-data:/data
      - jwt-private:/run/secrets:ro
    ports:
      - "127.0.0.1:${AUTH_HTTP_PORT:-8084}:${AUTH_HTTP_PORT:-8084}"
    healthcheck:
      test: ["CMD", "/auth", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 5s
    networks: [api-net]

  client-api:
    build:
      context: .
      dockerfile: services/client-api/Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    depends_on:
      aggregator:
        condition: service_healthy
    environment:
      API_HTTP_PORT: ${API_HTTP_PORT:-8080}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-aat-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-aat-client-api}
      AGGREGATOR_BASE_URL: ${AGGREGATOR_BASE_URL:-http://aggregator:8083}
      AGGREGATOR_API_KEY: ${AGGREGATOR_API_KEY:?Set a separate AGGREGATOR_API_KEY}
      AGGREGATOR_REQUEST_TIMEOUT: ${AGGREGATOR_REQUEST_TIMEOUT:-1s}
      API_MAX_INFLIGHT: ${API_MAX_INFLIGHT:-128}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-2s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-30s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-5s}
    volumes:
      - jwt-public:/run/secrets:ro
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-8080}:${API_HTTP_PORT:-8080}"
    healthcheck:
      test: ["CMD", "/client-api", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 10s
    networks: [api-net]

  dashboard-consumer:
    build:
      context: .
      dockerfile: services/dashboard-consumer/Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    environment:
      DASHBOARD_HTTP_PORT: ${DASHBOARD_HTTP_PORT:-8085}
      DASHBOARD_STATE_PATH: /data/dashboard.db
      CONSUMER_DEMO_KEY: ${CONSUMER_DEMO_KEY:?Set a locally generated CONSUMER_DEMO_KEY}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:?Set a separate locally generated NATS_TOKEN}
      NATS_STREAM_NAME: ${NATS_STREAM_NAME:-HAZARD_EVENTS}
      NATS_DASHBOARD_DURABLE: ${NATS_DASHBOARD_DURABLE:-dashboard-v1}
      NATS_ACK_WAIT: ${NATS_ACK_WAIT:-30s}
      NATS_MAX_ACK_PENDING: ${NATS_MAX_ACK_PENDING:-64}
      NATS_MAX_DELIVER: ${NATS_MAX_DELIVER:--1}
      NATS_FETCH_BATCH: ${NATS_FETCH_BATCH:-10}
      NATS_FETCH_EXPIRES: ${NATS_FETCH_EXPIRES:-2s}
      CONSUMER_NAK_DELAY: ${CONSUMER_NAK_DELAY:-5s}
    volumes:
      - dashboard-data:/data
    healthcheck:
      test: ["CMD", "/dashboard-consumer", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 15s
    networks: [event-net]

  notifier-consumer:
    build:
      context: .
      dockerfile: services/notifier-consumer/Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NOTIFIER_HTTP_PORT: ${NOTIFIER_HTTP_PORT:-8086}
      NOTIFIER_STATE_PATH: /data/notifier.db
      CONSUMER_DEMO_KEY: ${CONSUMER_DEMO_KEY:?Set a locally generated CONSUMER_DEMO_KEY}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:?Set a separate locally generated NATS_TOKEN}
      NATS_STREAM_NAME: ${NATS_STREAM_NAME:-HAZARD_EVENTS}
      NATS_NOTIFIER_DURABLE: ${NATS_NOTIFIER_DURABLE:-notifier-v1}
      NATS_ACK_WAIT: ${NATS_ACK_WAIT:-30s}
      NATS_MAX_ACK_PENDING: ${NATS_MAX_ACK_PENDING:-64}
      NATS_MAX_DELIVER: ${NATS_MAX_DELIVER:--1}
      NATS_FETCH_BATCH: ${NATS_FETCH_BATCH:-10}
      NATS_FETCH_EXPIRES: ${NATS_FETCH_EXPIRES:-2s}
      CONSUMER_NAK_DELAY: ${CONSUMER_NAK_DELAY:-5s}
    volumes:
      - notifier-data:/data
    healthcheck:
      test: ["CMD", "/notifier-consumer", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 15s
    networks: [event-net]

  third-consumer:
    profiles: [demo]
    build:
      context: .
      dockerfile: services/notifier-consumer/Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NOTIFIER_HTTP_PORT: 8087
      NOTIFIER_STATE_PATH: /data/third-consumer.db
      CONSUMER_DEMO_KEY: ${CONSUMER_DEMO_KEY:?Set a locally generated CONSUMER_DEMO_KEY}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:?Set a separate locally generated NATS_TOKEN}
      NATS_STREAM_NAME: ${NATS_STREAM_NAME:-HAZARD_EVENTS}
      NATS_NOTIFIER_DURABLE: third-consumer-v1
      NATS_ACK_WAIT: ${NATS_ACK_WAIT:-30s}
      NATS_MAX_ACK_PENDING: ${NATS_MAX_ACK_PENDING:-64}
      NATS_MAX_DELIVER: ${NATS_MAX_DELIVER:--1}
      NATS_FETCH_BATCH: ${NATS_FETCH_BATCH:-10}
      NATS_FETCH_EXPIRES: ${NATS_FETCH_EXPIRES:-2s}
      CONSUMER_NAK_DELAY: ${CONSUMER_NAK_DELAY:-5s}
    volumes:
      - third-consumer-data:/data
    healthcheck:
      test: ["CMD", "/notifier-consumer", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 15s
    networks: [event-net]

networks:
  # Source and API services need normal routing; these networks are not published directly.
  source-net: {}
  api-net: {}
  store-net:
    internal: true
  event-net:
    internal: true

volumes:
  auth-data:
  jwt-private:
    external: true
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}_jwt-private
  jwt-public:
    external: true
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}_jwt-public
  postgres-data:
  nats-data:
  dashboard-data:
  notifier-data:
  third-consumer-data:
